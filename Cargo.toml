[workspace]
members = ["crates/torcul-policy", "crates/torcul-media", "crates/torcul-cli"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "EUPL-1.2"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
sha2 = "0.11.1"
tempfile = "3.27.0"
wait-timeout = "0.2.1"
torcul-policy = { path = "crates/torcul-policy" }
torcul-media = { path = "crates/torcul-media" }
