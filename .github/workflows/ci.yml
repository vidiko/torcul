---
# Verification gate runs `make verify-all`, and Windows I/O tests exercise
# non-Unix media I/O. Both jobs are required checks; the gate also checks
# commit sign-offs.
#
# The job runs on a hosted runner until a cluster runner scale set exists for
# this repository. The standards engine is built here from one pinned commit
# of its public repository; no released binary and no moving branch is
# trusted.
name: Verification gate

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  # Published Praetor commit that builds the praetorctl this gate pins. The
  # name is the one the engine's hook launcher reads
  # (.config/lefthook/engine.sh), so the local hooks and `make verify-all`
  # run this same commit and not whatever praetorctl is on PATH.
  PRAETOR_REF: "96e22a033467109d559054bbc31dab9889fba5aa"

jobs:
  verify:
    name: Verification gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      # Full history: the sign-off step reads every commit of the pull request.
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check out pinned Praetor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cordanaLLM/praetor
          ref: ${{ env.PRAETOR_REF }}
          path: praetor-src
          persist-credentials: false

      - name: Set up the Go toolchain declared by Praetor
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: praetor-src/go.mod
          cache: false

      - name: Build pinned praetorctl from the published Praetor commit
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          GOFLAGS: -mod=readonly
        run: |
          test "$(git -C praetor-src rev-parse HEAD)" = "$PRAETOR_REF"
          mkdir -p "$RUNNER_TEMP/bin"
          # go vet first: the Go compiler has no warnings, so vet is the
          # warnings-as-errors form for the one Go build this gate runs.
          ( cd praetor-src && go mod download && go mod verify \
            && go vet ./... \
            && go build -trimpath -buildvcs=false \
              -o "$RUNNER_TEMP/bin/praetorctl" ./cmd/standardsctl )
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          # The Praetor checkout is a build input only; the audit must not
          # read it as content of this repository.
          rm -rf praetor-src

      # PRAETORCTL names the binary built above. Without it the Makefile
      # asks the hook launcher, which would install the pinned commit a
      # second time through the Go module proxy.
      - name: Install build prerequisites for pinned FFmpeg and bindgen
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang libx264-dev nasm pkg-config python3 xz-utils zlib1g-dev

      - name: Cache pinned FFmpeg 9.0.2 prefix
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ffmpeg-9.0.2
          key: ffmpeg-9.0.2-${{ runner.os }}-${{ hashFiles('tools/ci/install_ffmpeg.py') }}

      - name: Install pinned FFmpeg 9.0.2
        run: python3 -I tools/ci/install_ffmpeg.py "$RUNNER_TEMP/ffmpeg-9.0.2"

      - name: Set up Rust from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Verification gate
        run: make verify-all PRAETORCTL="$RUNNER_TEMP/bin/praetorctl"

      - name: Check FFmpeg-free torcul-media build
        # cargo check without a target filter is the selection that runs the
        # cargo::unused_dependencies lint; clippy with --all-targets does not.
        env:
          CARGO_BUILD_WARNINGS: deny
        run: |
          cargo check -p torcul-media --no-default-features --locked
          cargo clippy -p torcul-media --no-default-features --all-targets --locked -- -D warnings

      - name: Sign-off on pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            if ! git log -1 --format=%B "$sha" | grep -q '^Signed-off-by: '; then
              echo "::error::commit $sha lacks a Signed-off-by trailer"
              missing=1
            fi
          done
          exit "$missing"

  windows-io:
    name: Windows I/O tests
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Rust from rust-toolchain.toml
        shell: bash
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: Build and run FFmpeg-free library tests
        shell: bash
        run: cargo test -p torcul-media --no-default-features --lib --locked

      - name: Prove non-Unix I/O tests exist and pass
        shell: bash
        run: |
          listing="$(cargo test -p torcul-media --no-default-features --lib --locked -- --list)"
          printf '%s\n' "$listing"
          grep -Fxq 'io::io_tests::fingerprint_requires_unix_on_non_unix: test' <<< "$listing"
          grep -Fxq 'io::io_tests::open_regular_requires_unix_on_non_unix: test' <<< "$listing"
          output="$(cargo test -p torcul-media --no-default-features --lib --locked -- io::io_tests::fingerprint_requires_unix_on_non_unix io::io_tests::open_regular_requires_unix_on_non_unix --exact)"
          printf '%s\n' "$output"
          grep -Fq 'test result: ok. 2 passed;' <<< "$output"
