---
# SPDX-FileCopyrightText: 2026 Lusoris <lusoris@pm.me>
# SPDX-License-Identifier: EUPL-1.2
#
# Build the MkDocs site under --strict on every pull request and every push to
# main, and deploy it to GitHub Pages from main. Builds for main run in
# parallel; deploys run one at a time, and each deploys only while its commit
# is still the tip of main, so an older build never replaces a newer site.
# Pushes to main are not path-filtered: the link hook checks every tracked
# file, so every push to main needs a build of its own.
name: Docs

'on':
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

# One group per pull request (a newer push cancels the older run). Every push
# or dispatch gets a group of its own, so runs on main neither wait for nor
# cancel each other; the deploy job orders them.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number ||
    github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Docs build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Check out the source
        # yamllint disable-line rule:line-length
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # Full history: the revision-date plugin dates each page by its last
          # commit, and a shallow clone would date every page at the tip.
          fetch-depth: 0
          persist-credentials: false
      - name: Install the documentation tools
        run: |
          python3 -m venv "$RUNNER_TEMP/docs"
          "$RUNNER_TEMP/docs/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            -c docs/requirements.in -r docs/requirements.txt
      - name: Test the docs hooks
        run: |
          "$RUNNER_TEMP/docs/bin/python" -I -B docs/hooks/test_repo_links.py .
          "$RUNNER_TEMP/docs/bin/python" -I -B docs/hooks/test_front_matter.py .
          "$RUNNER_TEMP/docs/bin/python" -I -B docs/hooks/test_suppressions.py .
      - name: Configure Pages
        id: pages
        if: >-
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        # yamllint disable-line rule:line-length
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0
      - name: Build documentation
        env:
          DOCS_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          "$RUNNER_TEMP/docs/bin/mkdocs" build --strict
      - name: Upload Pages artifact
        if: >-
          (github.event_name == 'push' ||
          github.event_name == 'workflow_dispatch') &&
          github.ref == 'refs/heads/main'
        # yamllint disable-line rule:line-length
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: site

  deploy:
    name: Docs deploy
    needs: build
    if: >-
      (github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      # nosemgrep: hard-coded-tokens  # deploy-pages needs OIDC permission.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploys run one at a time and are never cancelled. queue: max keeps up
    # to 100 waiting deploys in order instead of replacing the waiting one.
    concurrency:
      group: pages
      cancel-in-progress: false
      queue: max
    steps:
      # Runs inside the serialized pages group right before the deploy, so a
      # re-run of an older deploy job also skips once main has moved on.
      - name: Check that the commit is still the tip of main
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ref="repos/$GITHUB_REPOSITORY/git/ref/heads/main"
          tip=$(timeout 60 gh api "$ref" --jq .object.sha)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Deploy skipped::main moved from" \
              "$GITHUB_SHA to $tip; the run for the newer commit deploys."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.tip.outputs.current == 'true'
        # yamllint disable-line rule:line-length
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
